services:
  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  shipment-api:
    build:
      context: .
      dockerfile: src/Services/Shipment.Api/Dockerfile
    ports:
      - "5001:5001"
    environment:
      ConnectionStrings__ShipmentDb: ${ShipmentDb}
      ConnectionStrings__RabbitMq: ${RabbitMq}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  tracking-api:
    build:
      context: .
      dockerfile: src/Services/Tracking.Api/Dockerfile
    ports:
      - "5002:5002"
    environment:
      ConnectionStrings__TrackingDb: ${TrackingDb}
      ConnectionStrings__Redis: ${Redis}
      ConnectionStrings__RabbitMq: ${RabbitMq}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  portal-web:
    build:
      context: .
      dockerfile: src/Web/Portal.Web/Dockerfile
    ports:
      - "5000:5000"
    environment:
      ShipmentApiUrl: http://shipment-api:5001
      TrackingApiUrl: http://tracking-api:5002
    depends_on:
      shipment-api:
        condition: service_healthy
      tracking-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  operator-ui:
    build:
      context: ./src/Web/operator-ui
    ports:
      - "4200:80"
    depends_on:
      shipment-api:
        condition: service_healthy
      tracking-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/", ">", "/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
